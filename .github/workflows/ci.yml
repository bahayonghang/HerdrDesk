name: G0 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-09-07
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; resolved 2026-09-07
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7; resolved 2026-09-10
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/terminal/package-lock.json
      - name: Terminal web npm ci typecheck test build
        run: |
          npm --prefix web/terminal ci
          npm --prefix web/terminal run typecheck
          npm --prefix web/terminal run build
          npm --prefix web/terminal test
      - name: Python regression tests
        run: python -m unittest discover -s tests/python -v
      - name: Probe synthetic selftest
        run: python scripts/probe_herdr.py selftest
      - name: Validate synthetic terminal capture
        run: python scripts/check_capture.py tests/fixtures/terminal-valid.ndjson
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5; resolved 2026-09-07
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore HerdDesk.slnx
      - name: Build BCL projects
        run: dotnet build HerdDesk.slnx --configuration Release -p:HerdDeskBclOnly=true --no-restore
      - name: Verify formatting
        run: dotnet format HerdDesk.slnx --verify-no-changes --no-restore --include src/HerdDesk.App --include src/HerdDesk.Infrastructure --include src/HerdDesk.Terminal.Web --include src/HerdDesk.Contracts/ConfigurationModels.cs --include src/HerdDesk.Contracts/SshConnectionContracts.cs --include src/HerdDesk.Contracts/HelperDeploymentContracts.cs --include src/HerdDesk.Contracts/DiagnosticModels.cs --include src/HerdDesk.Contracts/HostModels.cs --include src/HerdDesk.Contracts/RendererModels.cs --include src/HerdDesk.Contracts/Rpc --include src/HerdDesk.Contracts/State --include src/HerdDesk.Contracts/Terminal --include src/HerdDesk.Core/Store --include src/HerdDesk.Core/DeviceSessions --include src/HerdDesk.Core/Attention --include src/HerdDesk.Core/Aggregation --include src/HerdDesk.Core/Commands --include src/HerdDesk.Core/Recovery --include src/HerdDesk.Core/RenderFlowController.cs --include src/HerdDesk.Core/WebMessagePolicy.cs --include tests/Unit --include tests/Contract --include tests/Integration.Windows --include tests/HerdDesk.TestSupport
      - name: Run C# G0 smoke tests
        run: dotnet run --project tests/HerdDesk.Core.SmokeTests --configuration Release --no-build
      - name: Run Core unit tests
        run: dotnet run --project tests/Unit/HerdDesk.Core.Tests --configuration Release --no-build
      - name: Run Infrastructure unit tests
        run: dotnet run --project tests/Unit/HerdDesk.Infrastructure.Tests --configuration Release --no-build
      - name: Run App unit tests
        run: dotnet run --project tests/Unit/HerdDesk.App.Tests --configuration Release --no-build
      - name: Run Terminal.Web unit tests
        run: dotnet run --project tests/Unit/HerdDesk.Terminal.Web.Tests --configuration Release --no-build
      - name: Run contract tests
        run: dotnet run --project tests/Contract/HerdDesk.ContractTests.csproj --configuration Release --no-build
      - name: Run Integration.Windows console tests
        run: dotnet run --project tests/Integration.Windows --configuration Release --no-build
      - name: Install pinned Rust toolchain
        working-directory: bridge
        run: rustup show
      - name: Bridge fmt
        working-directory: bridge
        run: cargo fmt --all -- --check
      - name: Bridge clippy
        working-directory: bridge
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Bridge tests
        working-directory: bridge
        run: cargo test --workspace --locked
      - name: Install pinned filebridge Rust toolchain
        working-directory: filebridge
        run: rustup show
      - name: Filebridge fmt
        working-directory: filebridge
        run: cargo fmt --all -- --check
      - name: Filebridge clippy
        working-directory: filebridge
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Filebridge tests
        working-directory: filebridge
        run: cargo test --workspace --locked
      # No daemon installation, SSH access, terminal takeover, release publishing,
      # UI acceptance or credentials belong to this offline G0 job.
      # Linux must not compile WinUI. This job is not full-application green.
      # HD-034 Verify-on-fixture runs in python tests and validate_repository.py.
      # This matrix job must not publish the App windows TFM.

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-09-07
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; resolved 2026-09-07
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5; resolved 2026-09-07
        with:
          global-json-file: global.json
      - name: Windows desktop restore gate
        run: python scripts/run_windows_desktop_gate.py
      - name: Windows TFM shell-smoke without message loop
        run: dotnet run --project src/HerdDesk.App --configuration Release --framework net10.0-windows10.0.19041.0 --no-restore -- --shell-smoke
      - name: Unsigned local packaging layout
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/package_release.ps1 -Action Build -Restore -OutputRoot artifacts/packaging
      # Layout-only if MakeAppx is absent. Unsigned local layout is not a release install.
      # Job success is not merge-blocking proof. GitHub required-check remains UNVERIFIED.
      # Admitted path restores and builds the App windows TFM. It does not launch a WinUI window or live herdr.
      # HD-034 Build here is not AC41/AC42. Do not sign or install.
